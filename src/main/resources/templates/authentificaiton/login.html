<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Stores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
<div class="container card shadow-sm p-4" style="max-width: 400px;">
    <h2 class="text-center mb-4">Connexion</h2>

    <!-- Ila kan chi error f l-login, Spring kiy-sift parameter "error" -->
    <div th:if="${param.error}" class="alert alert-danger text-sm">
        Email awla Password ghalat!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <!-- Darouri s-smiya t-koun "username" hit Spring Security kiy-qlleb 3liha biha -->
            <input type="text" name="username" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
</div>
</body>
</html>
